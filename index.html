    const isDel=/^\[delete/.test(t);
    if(isDel){b.append(document.createTextNode(dl?dl[1]:''))}
    else if((x=t.match(/^\[sent a (picture|video|sticker|stiker)(?::\s*([^\]]+))?\]\s*(.*)$/))){
  const f=x[2]&&x[2].trim(),sk=/^(sticker|stiker)$/.test(x[1]),lbl=sk?'stiker':x[1]==='video'?'video':'foto';
  if(f){
    const i=$('img',sk?'stk':'ph');i.loading='lazy';i.alt='';i.src=f;i.onerror=()=>i.replaceWith($('div','st',lbl));
    if(x[1]==='video'){const w=$('div','vid');w.append(i,$('span','pl','▶'));b.append(w)}else b.append(i);
  }else b.append($('div','st',lbl));
  if(x[3])b.append($('div','cap',x[3]));
}
    else if(t){b.append(t)}
    if(tm){const s=$('span','tm',tm);if(k===me){s.append(' ',$('span','ck','✓✓'))}b.append(s)}
    if(isDel){const old=[...b.childNodes].filter(notNm);old.forEach(n=>n.remove());mkDel(b,old)}
    row.append(b);chat.append(row);last=k;rows.push({k,t,b});
  });
  };
const tweetsOf=TWEETS=>{const T=[];
  TWEETS.split('\n').forEach(l=>{
    let m=l.match(/^tweet by ([A-Za-z]): ?(.*)$/);
    if(m){T.push({k:m[1],t:m[2],r:[]});return}
    const c=T[T.length-1];if(!c)return;
    m=l.match(/^(waktu|suka|repost|tayang|gambar|qrt): ?(.*)$/);
    if(m){c[m[1]]=m[2].trim();return}
    m=l.match(/^([A-Za-z])(?: \[replied to ([A-Za-z])\])?: ?(.*)$/);
    if(m)c.r.push({k:m[1],to:m[2],t:m[3]});
  });
  return T};

const getTxt=f=>fetch(f).then(r=>r.ok?r.text():'').catch(()=>'');
const okTxt=t=>t.trim()&&!/^\s*<!doctype html/i.test(t);
const sv=(k,v)=>{try{localStorage.setItem('au:'+k,JSON.stringify(v))}catch(e){}};
const ld=k=>{try{return JSON.parse(localStorage.getItem('au:'+k))}catch(e){return null}};
const toast=m=>{const t=E('toast');t.textContent=m;t.hidden=false;setTimeout(()=>{t.hidden=true},1800)};
let D={parts:[]},panels=[],pid='',tt;

const parsePart=txt=>{
  const out=[];let cur=null,me='A',wp='';
  txt.split('\n').forEach(l=>{
    if(l[0]==='#')return;
    let m=l.match(/^---\s*(.+?)\s*---\s*$/);
    if(m){const f=m[1].split('|').map(x=>x.trim()),pv=/^POV:/i.test(f[0]);if(pv){if(f[1])me=f[1];if(f[2])wp=f[2]}out.push({t:'chip',x:pv?f[0]:m[1],pov:pv});cur=null;return}
    m=l.match(/^\[wallpaper\]\s*(.*)$/i);
    if(m){wp=m[1].trim();return}
    m=l.match(/^\[(wa|twitter|narasi|dm twitter|status)\]\s*(.*)$/i);
    if(m){cur={t:m[1].toLowerCase(),me,wp,a:m[2].split('|').map(x=>x.trim()),lines:[]};out.push(cur);return}
    if(cur)cur.lines.push(l);
  });
  return out;
};
const body=(k,c,tmText,to)=>{const bd=$('div','bd');bd.append(nameLine(k,tmText));const lb=lab(k);if(lb)bd.append(lb);if(to)bd.append($('div','to','Membalas '+pk(to).u));bd.append($('p','xt',c.t));return bd};
const buildDet=(det,c)=>{
  let prev=null;
  c.r.forEach(q=>{const r=$('div','xr'),ac=$('div','ac');ac.append(av(q.k));if(q.to&&prev){prev.classList.add('nx');r.classList.add('th')}const bd=body(q.k,q,'',q.to);bd.append(acts(q));r.append(ac,bd);det.append(r);prev=r});
};
  const qrtCard=s=>{const f=s.split('|').map(x=>x.trim()),k=f[0],d=$('div','qrt'),h=$('div','qh'),a=av(k);a.style.cssText='width:20px;height:20px;font-size:10px';h.append(a,hn(k),$('span','mt',' '+pk(k).u));d.append(h);if(f[1])d.append($('p','xt',f[1]));if(f[2])d.append(pimg(f[2]));return d};
const mkTw=c=>{
  const p=$('div','pn tw'),sum=$('div','xr tap'),ac=$('div','ac'),det=$('div','dt');let built=false;
  ac.append(av(c.k));const bd=body(c.k,c,c.waktu||'');if(c.gambar)bd.append(pimg(c.gambar));if(c.qrt)bd.append(qrtCard(c.qrt));bd.append(acts(c));sum.append(ac,bd);det.hidden=true;
  const tog=()=>{const open=det.hidden;det.hidden=!open;if(open&&!built){built=true;buildDet(det,c)}};
  sum.onclick=tog;p.append(sum,det);p._open=()=>{if(det.hidden)tog()};return p;
};
const mkWa=b=>{
  const [n,img,mem]=b.a,p=$('div','pn wa'),h=$('div','wh2'),bd=$('div','bd2'),ar=$('i',null,'▾'),wab=$('div','wab');
  let lastTxt='',built=false;
  b.lines.forEach(l=>{const m=l.match(/^([A-Za-z]): ?(.*)$/);if(m&&!/^\[delete/.test(m[2])){let t=m[2].replace(/^\[replied to .*?\]\s*/,'');t=/^\[sent a/.test(t)?'📷 '+t.replace(/^\[sent a [^\]]*\]\s*/,''):t;lastTxt=(mem?(m[1]===b.me?'Kamu':pk(m[1]).n.split(' ')[0])+': ':'')+t}});
  const a=$('div','av',(n||'?')[0].toUpperCase());a.style.background=col('W');pic(a,img);
  const pv=$('small',null,lastTxt);bd.append($('b',null,n),pv);h.append(a,bd,ar);wab.hidden=true;const wpl=$('div','wpl');if(b.wp)wpl.style.backgroundImage='url("'+b.wp.replace(/"/g,'%22')+'")';wab.append(wpl);
  h.onclick=()=>{const open=wab.hidden;wab.hidden=!open;pv.textContent=open?(mem||''):lastTxt;pv.hidden=open&&!mem;ar.textContent=open?'▴':'▾';if(open&&!built){built=true;bubbles(wab,b.lines.join('\n'),b.me,!!mem)}};
  p.append(h,wab);p._wab=wab;p._open=()=>{if(wab.hidden)h.onclick()};return p;
};
const mkNar=b=>{const d=$('div','nar');b.lines.forEach(l=>{if(l.trim())d.append($('p',null,l.trim()))});return d};
const mkDm=b=>{const [n,img,k]=b.a,p=mkWa({...b,a:[n,img,''],me:k||b.me,wp:''});p.classList.add('dmv');return p};
const mkSt=b=>{
  const [n,img,foto,wkt]=b.a,p=$('div','pn sts'),h=$('div','wh2'),bd=$('div','bd2'),ar=$('i',null,'▾'),v=$('div','stv');
  const a=$('div','av ring',(n||'?')[0].toUpperCase());a.style.background=col('W');pic(a,img);
  bd.append($('b',null,n),$('small',null,'Status'+(wkt?' · '+wkt:'')));h.append(a,bd,ar);
  if(foto)v.append(pimg(foto));
  const cap=b.lines.map(x=>x.trim()).filter(Boolean).join('\n');if(cap)v.append($('p','stc',cap));
  v.hidden=true;h.onclick=()=>{v.hidden=!v.hidden;ar.textContent=v.hidden?'▾':'▴'};
  p.append(h,v);return p;
};
function renderPart(txt){
  const flow=E('flow');flow.replaceChildren();panels=[];
  const add=el=>{el.dataset.i=panels.length;panels.push(el);flow.append(el)};
  parsePart(txt).forEach(b=>{
    if(b.t==='chip')add($('div','chip'+(b.pov?' pov':''),b.x));
    else if(b.t==='wa')add(mkWa(b));
    else if(b.t==='narasi')add(mkNar(b));
    else if(b.t==='dm twitter')add(mkDm(b));
    else if(b.t==='status')add(mkSt(b));
    else tweetsOf(b.lines.join('\n')).forEach(c=>add(mkTw(c)));
  });
  const first=panels.find(el=>el._open);if(first)first._open();
}
const TOP=64;
const curPos=()=>{
  let i=panels.findIndex(el=>el.getBoundingClientRect().bottom>TOP);if(i<0)i=0;
  const el=panels[i],r=el.getBoundingClientRect(),pos={i};
  if(el._wab&&!el._wab.hidden){
    const ch=[...el._wab.children];let m=ch.findIndex((c,j)=>j>0&&c.getBoundingClientRect().bottom>TOP);
    if(m>0)pos.m=m;
  }else pos.o=Math.max(0,Math.round(TOP-r.top));
  return pos;
};
const goPos=L=>{
  const el=panels[L.i];if(!el)return;
  if(el._open&&(L.m!=null||L.o>0))el._open();
  let t=el,extra=0;
  if(L.m!=null&&el._wab&&el._wab.children[L.m])t=el._wab.children[L.m];
  else extra=L.o||0;
  window.scrollTo(0,Math.max(0,t.getBoundingClientRect().top+window.scrollY-TOP+extra));
};
window.addEventListener('scroll',()=>{if(!pid)return;clearTimeout(tt);tt=setTimeout(()=>{if(window.scrollY>120)sv('last',{p:pid,...curPos()})},300)});
E('bmb').onclick=()=>{sv('bm',{p:pid,...curPos()});toast('Bookmark disimpan')};
E('bkb').onclick=()=>{location.hash='';route()};

function showHome(){
  pid='';E('rd').hidden=true;E('home').hidden=false;document.body.classList.remove('dev');
  E('jd').textContent=D.t||'The Things We Never Call Love';
  const L=ld('last'),B=ld('bm'),pl=E('plist');pl.replaceChildren();
  D.parts.forEach(p=>{
    const b=$('button','pr'+(p.txt?'':' lock')),d=$('div');
    d.append($('b',null,p.n),$('small',null,p.txt?(p.note||'Buka'):'Segera hadir'));b.append(d);
    const s=[];if(L&&L.p===p.id)s.push('Terakhir dibaca');if(B&&B.p===p.id)s.push('🔖 Bookmark');
    if(s.length)b.append($('small',null,s.join(' · ')));
    if(p.txt)b.onclick=()=>{location.hash=p.id;route()};else b.disabled=true;
    pl.append(b);
  });
  window.scrollTo(0,0);
}
function openPart(p){
  pid=p.id;E('home').hidden=true;E('rd').hidden=false;document.body.classList.add('dev');
  E('ptl').textContent=p.n;renderPart(p.txt);
  const ix=D.parts.findIndex(x=>x.id===p.id),nv=$('div','pnav');
  const mk=(q,t)=>{const b=$('button',null,t);if(q&&q.txt)b.onclick=()=>{location.hash=q.id;route()};else b.disabled=true;return b};
  nv.append(mk(D.parts[ix-1],'‹ Part sebelumnya'),mk(D.parts[ix+1],'Part berikutnya ›'));
  E('flow').append(nv);
  const L=ld('last'),B=ld('bm'),r=$('div','rsm');
  if(L&&L.p===pid&&(L.i>0||L.m>0||L.o>0)){const b=$('button',null,'Lanjut dari terakhir dibaca');b.onclick=()=>goPos(L);r.append(b)}
  if(B&&B.p===pid){const b=$('button',null,'🔖 Ke bookmark');b.onclick=()=>goPos(B);r.append(b)}
  if(r.children.length)E('flow').prepend(r);
  window.scrollTo(0,0);
}
function route(){const id=location.hash.slice(1),p=D.parts.find(x=>x.id===id&&x.txt);if(p)openPart(p);else showHome()}
window.onhashchange=route;

Promise.all([getTxt('daftar.txt'),getTxt('akun.txt')]).then(([d,a])=>{
  (okTxt(d)?d:'').split('\n').forEach(l=>{
    if(!l.trim()||l[0]==='#')return;const f=l.split('|').map(x=>x.trim());
    if(f[0]==='judul')D.t=f[1];
    else if(f[0]==='wallpaper'&&f[1])document.documentElement.style.setProperty('--wp','url('+f[1]+')');
    else if(/\.txt$/.test(f[0]))D.parts.push({id:f[0].replace(/\.txt$/,''),file:f[0],n:f[1]||f[0],note:f[2]||''});
  });
  (okTxt(a)?a:'').split('\n').forEach(l=>{
    if(!l.trim()||l[0]==='#')return;const f=l.split('|').map(x=>x.trim());if(!f[0])return;
    const p=pk(f[0]);if(f[1])p.n=f[1];if(f[2])p.h=f[2];if(f[3])p.u=f[3];if(f[4])p.img=f[4];if(f[5])p.lab=f[5];if(f[6])p.c=f[6];if(f[7])p.v=f[7];
  });
  return Promise.all(D.parts.map(p=>getTxt(p.file).then(t=>{p.txt=okTxt(t)?t:''})));
}).then(()=>{document.title=D.t||'The Things We Never Call Love';route()});
</script>
